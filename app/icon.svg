<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#03050D" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  
  <!-- Outer rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" stroke="#0EA5E9" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Circuit pins -->
  <line x1="12" y1="24" x2="18" y2="24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="32" x2="18" y2="32" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="40" x2="18" y2="40" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  
  <line x1="46" y1="24" x2="52" y2="24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="46" y1="32" x2="52" y2="32" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <line x1="46" y1="40" x2="52" y2="40" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

  <line x1="24" y1="12" x2="24" y2="18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="12" x2="32" y2="18" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="12" x2="40" y2="18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

  <line x1="24" y1="46" x2="24" y2="52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="46" x2="32" y2="52" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="46" x2="40" y2="52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  
  <!-- Central Microchip -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="#070B19" stroke="url(#cyan-grad)" stroke-width="2" />
  
  <!-- Inner TP Monogram -->
  <text x="32" y="37" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">TP</text>
  
  <!-- Neural dots -->
  <circle cx="12" cy="24" r="1.5" fill="#38BDF8" />
  <circle cx="12" cy="32" r="1.5" fill="#34D399" />
  <circle cx="12" cy="40" r="1.5" fill="#38BDF8" />
  <circle cx="52" cy="24" r="1.5" fill="#38BDF8" />
  <circle cx="52" cy="32" r="1.5" fill="#34D399" />
  <circle cx="52" cy="40" r="1.5" fill="#38BDF8" />
</svg>